# Historial del bug de acentos/ñ corruptos en NVARCHAR (ej. "Lácteos" ->
# "L●cteos"): se agregó "client charset = UTF-8" el 2026-07-17, se quitó el
# 2026-07-18 creyendo que esa directiva era la causa — pero quitarla NO
# arregló el bug (confirmado por el usuario con una captura posterior). Un
# dump de bytes crudo en SQL Server (CONVERT(VARBINARY,...)) confirmó que el
# dato almacenado es UTF-16LE estándar y correcto, así que el bug nunca fue
# de los datos ni de esta app — vive en algún punto de la conversión de
# charset entre FreeTDS y el decodificador de `mssql_connection`
# (freetds_bindings.dart, casos SYBNTEXT/SYBNVARCHAR).
#
# Que quitar la directiva no haya cambiado nada sugiere que este .conf, solo,
# no está determinando el charset real usado — se restaura aquí (2026-07-18,
# segundo intento) junto con forzar también la variable de entorno LANG (ver
# sqlserver_connector.dart), que es lo que muchos builds de FreeTDS consultan
# para detectar el locale/charset cuando el .conf no alcanza. Es una
# hipótesis a probar, no un arreglo confirmado — si el bug persiste después
# de esto, el siguiente paso ya no es seguir ajustando este .conf sino
# parchear directamente el decodificador del paquete (vía dependency_override
# local que apunte a una copia parcheada de `mssql_connection`).
#
# Cargado vía la variable de entorno FREETDSCONF, seteada en
# sqlserver_connector.dart antes de la primera conexión — ver ese archivo.
[global]
    tds version = 7.4
    client charset = UTF-8
